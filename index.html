<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Tập</title>
<meta name="theme-color" content="#0b7a75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Tập">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }

/* Layout: một cột hẹp cho điện thoại, thanh trên cố định, thẻ bài tập xếp dọc, thanh nghỉ hoặc thanh lưu cố định ở đáy */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --field: #f4f6f7;
  --ink: #14202a;
  --muted: #5b6a76;
  --line: #d6dde2;
  --accent: #0b7a75;
  --accent-ink: #ffffff;
  --tint: #dcf1ef;
  --warn: #b4400b;
  --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1519; --surface: #182026; --field: #11181d; --ink: #e8eef2; --muted: #93a3af;
    --line: #2a3640; --accent: #3fd0c7; --accent-ink: #06201e; --tint: #16332f; --warn: #fb923c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1519; --surface: #182026; --field: #11181d; --ink: #e8eef2; --muted: #93a3af;
  --line: #2a3640; --accent: #3fd0c7; --accent-ink: #06201e; --tint: #16332f; --warn: #fb923c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--body);
  padding-block: 0 140px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.wrap { max-width: 560px; margin: 0 auto; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 10px;
}
.brand { font: 700 24px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.tabs { display: flex; background: var(--line); border-radius: 12px; padding: 3px; }
.tabs a {
  text-decoration: none; color: var(--muted); padding: 8px 10px; border-radius: 9px;
  font: 600 16px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
}
.tabs a.on { background: var(--surface); color: var(--ink); }
@media (max-width: 520px) {
  .brand { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tabs { flex: 1; }
  .tabs a { flex: 1; text-align: center; padding: 10px 4px; }
}
#status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin: 0 0 4px; min-height: 20px; }
#status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
#status[data-k="saved"]::before, #status[data-k="synced"]::before { background: var(--accent); }
#status[data-k="error"]::before, #status[data-k="unreach"]::before { background: var(--warn); }
#status[data-k="error"], #status[data-k="unreach"] { color: var(--warn); }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.seg button {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-height: 64px; min-width: 0;
}
.seg b { font: 700 24px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; overflow-wrap: anywhere; }
.seg small { color: var(--muted); font-size: 13px; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button.on small { color: var(--accent-ink); opacity: .85; }
.seg button.add { border-style: dashed; background: transparent; justify-content: center; align-items: center; color: var(--muted); font-weight: 600; }
.ptools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

.meta { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 14px; color: var(--muted); }
.meta input[type="date"] { height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 10px; font-size: 16px; }
.rests { display: flex; align-items: center; gap: 6px; }
.rests button { height: 40px; min-width: 48px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-weight: 600; }
.rests button.on { border-color: var(--accent); background: var(--tint); color: var(--ink); }
.week { display: flex; align-items: center; gap: 8px; }
.pips { display: flex; gap: 4px; }
.pips i { width: 18px; height: 8px; border-radius: 4px; background: var(--line); }
.pips i.on { background: var(--accent); }

.prog { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.prog span { font: 600 15px var(--body); font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
.kcal { margin-top: 10px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.kcal b { font: 700 30px/1 var(--display); color: var(--ink); letter-spacing: .01em; }
.kcal .u { font: 600 15px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin-left: -8px; }
.kcal .warn { color: var(--warn); width: 100%; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
.ex-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ex-head h2 { font: 700 24px/1.1 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; min-width: 0; }
.target { flex: none; font: 600 15px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; white-space: nowrap; }
.cue { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.last { margin: 6px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.last b { color: var(--ink); font-weight: 600; }
.mus { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mus span { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.mus span.p { background: var(--tint); border-color: transparent; color: var(--ink); font-weight: 600; }

.srow { display: grid; grid-template-columns: 34px 1fr 1fr 52px; gap: 8px; align-items: center; margin-top: 8px; }
.srow.nw { grid-template-columns: 34px 1fr 52px; }
.srow.head { margin-top: 12px; margin-bottom: -2px; font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.srow .n { font: 700 22px var(--display); color: var(--muted); text-align: center; }
.f {
  width: 100%; min-width: 0; height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--field);
  font: 600 22px var(--display); text-align: center; padding: 0 6px; font-variant-numeric: tabular-nums;
}
.f::placeholder { color: var(--muted); opacity: .55; }
.srow.done .f { background: var(--tint); border-color: var(--accent); }
.chk {
  width: 52px; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; color: transparent;
}
.chk.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ex-tools { display: flex; gap: 8px; margin-top: 10px; }
.ghost { height: 40px; padding: 0 12px; border: 1px dashed var(--line); background: transparent; border-radius: 10px; color: var(--muted); font-size: 14px; font-weight: 500; }
.ghost.arm { border-color: var(--warn); color: var(--warn); }
.kc { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kc b { color: var(--ink); font-weight: 600; }

details.info { margin-top: 8px; }
details.info > summary { cursor: pointer; height: 40px; display: flex; align-items: center; font-weight: 600; font-size: 14px; color: var(--accent); }
.info .blk { margin-top: 10px; font-size: 14px; }
.info .blk h4 { margin: 0 0 4px; font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.info ol, .info ul { margin: 0; padding-left: 20px; }
.info li { margin: 2px 0; }
.info .kd { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--field); font-size: 13px; font-variant-numeric: tabular-nums; }
.info .kd .r { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.info .kd .r span:last-child { text-align: right; white-space: nowrap; }
.info .kd .t { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; font-weight: 600; }

.walk h2 { font: 700 24px/1.1 var(--display); margin: 0; }
.walk .top2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.walk .row { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.walk .f { width: 68px; }
.walk .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.walk .grid2 label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.walk .grid2 .f { width: 100%; }
textarea.note { width: 100%; min-height: 84px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 10px 12px; font-size: 16px; resize: vertical; }
.card h3, .h3 { font: 600 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

details.prof { padding: 0 14px; }
details.prof > summary { list-style: none; cursor: pointer; min-height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 8px 0; }
details.prof > summary::-webkit-details-marker { display: none; }
details.prof > summary b { font: 700 20px/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
details.prof > summary small { font-size: 13px; color: var(--muted); }
details.prof > summary small.warn { color: var(--warn); }
details.prof[open] { padding-bottom: 14px; }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.pgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.pgrid select.f { font: 600 18px var(--display); text-align-last: center; }
.pgrid .f { height: 44px; }

.sum { margin-top: 8px; font-size: 15px; color: var(--muted); }
.sum b { color: var(--ink); font-weight: 600; }
.empty { margin-top: 12px; padding: 18px 14px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); }
.sess { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.sess summary { list-style: none; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; }
.sess summary::-webkit-details-marker { display: none; }
.sess .d { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font: 700 22px/1 var(--display); }
.chip { font: 600 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; background: var(--tint); }
.sess .st { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sess .body { padding: 0 14px 14px; border-top: 1px solid var(--line); }
.sess .li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.sess .li span:last-child { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; min-width: 0; }
.sess .acts { display: flex; gap: 8px; margin-top: 12px; }
.btn { height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.del.arm { border-color: var(--warn); color: var(--warn); }
.pr { display: grid; grid-template-columns: 1fr 96px; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pr:last-child { border-bottom: 0; }
.pr .nm { font-weight: 600; min-width: 0; }
.pr .dl { grid-column: 1; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pr svg { grid-column: 2; grid-row: 1 / span 2; width: 96px; height: 32px; }

/* cân nặng */
.wform { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wform label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.wform .dt { height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 0 10px; font-size: 16px; min-width: 0; width: 100%; }
.wform .btn { grid-column: 1 / -1; }
.warnmsg { color: var(--warn); min-height: 20px; }
.wbig { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.wbig b { font: 700 52px/1 var(--display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.wbig span { font: 600 18px var(--display); letter-spacing: .06em; text-transform: uppercase; }
.wbig small { width: 100%; font-size: 13px; color: var(--muted); }
.wgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 10px; margin-top: 14px; }
.wgrid div { min-width: 0; }
.wgrid span { display: block; font-size: 12px; color: var(--muted); }
.wgrid b { font: 700 20px/1.2 var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.rng { display: flex; gap: 6px; margin-bottom: 8px; }
.rng button { height: 36px; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-weight: 600; font-size: 14px; }
.rng button.on { border-color: var(--accent); background: var(--tint); }
.ch { width: 100%; height: auto; display: block; }
.ch .g { stroke: var(--line); stroke-width: 1; }
.ch text { fill: var(--muted); font: 11px var(--body); }
.ch .ma { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.ch .pt { fill: var(--muted); opacity: .7; }
.ch .last { fill: var(--accent); }
.ch .goal { stroke: var(--warn); stroke-dasharray: 4 4; stroke-width: 1.5; }
.ch .gt { fill: var(--warn); }
.leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.wr { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.wr:last-child { border-bottom: 0; }
.wr b { font-weight: 600; }
.wr small { display: block; color: var(--muted); font-size: 12px; }
.wr .v { font: 700 20px var(--display); font-variant-numeric: tabular-nums; text-align: right; }
.wr .v small { font: 400 12px var(--body); }

.mbox { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--field); }
.mbox > summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; font-weight: 600; font-size: 15px; }
.mbox[open] { padding-bottom: 12px; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.mgrid .f { background: var(--surface); height: 44px; }
.mtip { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
.msel { height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 10px; font-size: 16px; width: 100%; margin-bottom: 10px; }
button.mr { width: 100%; display: grid; grid-template-columns: 1fr auto 80px; gap: 8px; align-items: center; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
button.mr:last-child { border-bottom: 0; }
.mr .nm { font-weight: 600; min-width: 0; }
.mr .nm small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.mr .v { font: 700 22px var(--display); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mr svg { width: 80px; height: 27px; }
.mr.on .nm b { color: var(--accent); }
.rt { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; }
.rt:last-child { border-bottom: 0; }
.rt b { font: 700 22px var(--display); font-variant-numeric: tabular-nums; }
.rt small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }

/* tạo buổi */
.back { display: inline-flex; align-items: center; height: 40px; color: var(--muted); text-decoration: none; font-weight: 600; }
.bname { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.bname input[type="text"] { flex: 1; min-width: 0; height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px; font: 700 24px var(--display); text-transform: uppercase; letter-spacing: .03em; }
.bfrom { margin-top: 8px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bfrom select { height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 10px; font-size: 16px; }
.step-h { margin: 16px 0 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.step-h b { font: 700 22px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.step-h span { font-size: 13px; color: var(--muted); }
.step-why { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.sgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.sg { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 58px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sg b { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.sg small { font-size: 12px; color: var(--muted); }
.sg:active { background: var(--tint); }
.sg .why { color: var(--accent); font-weight: 600; }
.sel { margin-top: 16px; }
.it { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; }
.it .r1 { display: grid; grid-template-columns: 28px 1fr auto 44px; gap: 8px; align-items: center; padding: 6px 6px 6px 10px; min-height: 52px; }
.it .no { font: 700 22px var(--display); color: var(--muted); }
.it .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.it .nm small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.it .tg { height: 36px; border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 0 10px; font: 600 16px var(--display); letter-spacing: .03em; }
.it .x { height: 44px; width: 44px; border: 0; background: transparent; color: var(--muted); font-size: 22px; }
.it .r2 { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.stp { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.stp button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; }
.stp output { min-width: 28px; text-align: center; font: 700 22px var(--display); color: var(--ink); }
.mv { display: flex; gap: 6px; margin-left: auto; }
.mv button { height: 40px; min-width: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.all { margin-top: 16px; }
.all summary { cursor: pointer; height: 44px; display: flex; align-items: center; font-weight: 600; color: var(--muted); }
.all input[type="search"] { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px; font-size: 16px; margin-top: 4px; }
.gl { margin: 14px 0 0; font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dock {

  function addWaterOn(ds, ml, kind) {

    d.wlog = d.wlog || []; d.wlog.push({ m: ml, k: kind === 't' ? 't' : 'n' });

  function undoWaterOn(ds, onlyKind) {

  function nutriClick(act, b) {

      var did = b.getAttribute('data-id');
      if (delArm !== did) {
        delArm = did; render();
        setTimeout(function () { if (delArm === did) { delArm = null; if (view === 'hist') render(); } }, 3000);
        return;
      }
      delArm = null;
      delete sessions[did]; delete queue[did];
      if (did === curId()) { loadCur(); }
      persistLocal();
      if (col) { col.doc(did).delete().catch(function () { setStatus('error'); }); }
      render(); return;
    }
    /* cân nặng */
    if (act === 'w-save') { saveWeight(); return; }
    if (act === 'w-range') { wRange = +b.getAttribute('data-v'); render(); return; }
    if (act === 'w-edit') { var wd = weights[b.getAttribute('data-d')]; if (wd) { wEdit = clone(wd); wEditMode = true; render(); window.scrollTo(0, 0); } return; }
    if (act === 'm-pick') { wMetric = b.getAttribute('data-k'); render(); var cc = $('#wChartCard'); if (cc) cc.scrollIntoView({ block: 'start' }); return; }
    if (act === 'w-del') {
      var wdt = b.getAttribute('data-d');
      if (wDelArm !== wdt) {
        wDelArm = wdt; render();
        setTimeout(function () { if (wDelArm === wdt) { wDelArm = null; if (view === 'weight') render(); } }, 3000);
        return;
      }
      wDelArm = null; delete weights[wdt]; lsSet('sotap.weights', JSON.stringify(weights));
      if (weightsCol) { weightsCol.doc(wdt).delete().catch(function () { setStatus('error'); }); }
      render(); return;
    }
    /* thêm / sửa buổi */
    if (act === 'b-new') { flushNow(); openBuilder(null); return; }
    if (act === 'b-editplan') { flushNow(); openBuilder(curPlan); return; }
    if (act === 'b-delplan') {
      if (!delPlanArm) {
        delPlanArm = true; render();
        setTimeout(function () { if (delPlanArm) { delPlanArm = false; if (view === 'today') render(); } }, 3000);
        return;
      }
      delPlanArm = false;
      var pid = curPlan;
      flushNow();
      delete plans[pid]; lsSet('sotap.plans', JSON.stringify(plans));
      if (plansCol) { plansCol.doc(pid).delete().catch(function () { setStatus('error'); }); }
      if (!PLANS[pid]) curPlan = 'A';
      loadCur(); render(); return;
    }
    if (act === 'b-cancel') {
      B = null; view = 'today'; location.hash = '#hom-nay'; render(); window.scrollTo(0, 0);
      e.preventDefault(); return;
    }
    if (act === 'b-save') { savePlan(); return; }
    if (act === 'b-add' && B) {
      var lx = libOf(b.getAttribute('data-id'));
      if (B.items.length < 10 && !B.items.some(function (it) { return it.id === lx.id; })) B.items.push({ id: lx.id, sets: lx.sets, reps: lx.reps });
      render(); return;
    }
    if (act === 'b-rm' && B) { B.items.splice(i, 1); B.open = null; render(); return; }
    if (act === 'b-edit' && B) { B.open = B.open === i ? null : i; render(); return; }
    if (act === 'b-up' && B && i > 0) { var u = B.items.splice(i, 1)[0]; B.items.splice(i - 1, 0, u); B.open = i - 1; render(); return; }
    if (act === 'b-dn' && B && i < B.items.length - 1) { var dn = B.items.splice(i, 1)[0]; B.items.splice(i + 1, 0, dn); B.open = i + 1; render(); return; }
    if (act === 'b-step' && B) {
      var it = B.items[i], f = b.getAttribute('data-f'), dlt = +b.getAttribute('data-d');
      if (f === 'sets') it.sets = Math.max(1, Math.min(8, it.sets + dlt));
      else it.reps = Math.max(1, Math.min(libOf(it.id).unit === 'sec' ? 180 : 60, it.reps + dlt));
      render();
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushNow(); else keepAwake();
  });
  window.addEventListener('pagehide', flushNow);

  /* ---------- db ---------- */
  function isTyping() {
    var ae = document.activeElement;
    return !!(ae && app.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
  }
  function onSnap(snap) {
    var m = {};
    snap.docs.forEach(function (d) { var v = d.data(); if (v) m[d.id] = v; });
    Object.keys(queue).forEach(function (k) { m[k] = queue[k]; });
    sessions = m;
    if (!snap.metadata.fromCache) {
      gotFirst = true;
      if (!saving && !Object.keys(queue).length && status !== 'error') setStatus(status === 'saving' ? 'saving' : (status === 'saved' ? 'saved' : 'synced'));
    }
    persistLocal();
    if (view === 'hist' || view === 'detail') { render(); }
    else if (view === 'today' && !touched && !isTyping()) { loadCur(); render(); }
  }
  function onPlans(snap) {
    var m = {};
    snap.docs.forEach(function (d) { var v = d.data(); if (v && Array.isArray(v.items)) m[d.id] = v; });
    plans = m;
    lsSet('sotap.plans', JSON.stringify(plans));
    if (view === 'today' && !isTyping()) { if (!planDef(curPlan)) curPlan = 'A'; if (!touched) loadCur(); render(); }
  }
  function onWeights(snap) {
    var m = {};
    snap.docs.forEach(function (d) { var v = d.data(); if (v && v.date) m[d.id] = v; });
    weights = m;
    lsSet('sotap.weights', JSON.stringify(weights));
    if (view === 'weight' && !isTyping()) render();
  }
  function onProfile(snap) {
    if (!snap.exists) { if (Object.keys(profile).length) saveProfile(); return; }
    var v = snap.data();
    if (!v || isTyping()) return;
    profile = Object.assign({}, v);
    lsSet('sotap.profile', JSON.stringify(profile));
    if (view === 'today') render();
  }
  /* ---------- hồ sơ (bản web) ---------- */
  var accBusy = false;
  window.SOTAP_SYNC = async function () {
    flushNow(); clearTimeout(profTimer);
    if (profDoc) { try { await profDoc.set(clone(profile)); } catch (e) {} }
    for (var i = 0; i < 80 && (saving || nsaving || Object.keys(queue).length || Object.keys(nq).length); i++) await new Promise(function (r) { setTimeout(r, 100); });
  };
  function accSwitch() {
    if (accBusy || !window.SOTAP_ACCOUNT) return;
    accBusy = true;
    var b = $('#accBtn'); if (b) b.textContent = 'Đang lưu…';
    window.SOTAP_SYNC().then(function () { window.SOTAP_ACCOUNT.leave(); }, function () { window.SOTAP_ACCOUNT.leave(); });
  }
  function accInit() {
    var a = window.SOTAP_ACCOUNT, b = $('#accBtn');
    if (a && b) { b.hidden = false; b.textContent = 'Hồ sơ: ' + a.name + ' · Đổi'; }
  }

  async function init() {
    var ap = wkPlan(mondayOf(curDate))[curDate]; if (ap && planDef(ap)) curPlan = ap;
    loadCur(); render();
    var d = null;
    try { if (window.claude && window.claude.use) d = await window.claude.use('db'); } catch (e) { d = null; }
    if (!d) { setStatus('local'); return; }
    db = d; col = db.collection('sessions'); plansCol = db.collection('plans'); profDoc = db.doc('profile/me'); weightsCol = db.collection('weights'); foodsCol = db.collection('foods'); diaryCol = db.collection('diary'); sleepsCol = db.collection('sleeps'); combosCol = db.collection('combos');
    setTimeout(function () { if (!gotFirst && status === 'connecting') setStatus('unreach'); }, 10000);
    col.onSnapshot(onSnap, function () { setStatus('error'); });
    plansCol.onSnapshot(onPlans, function () { setStatus('error'); });
    profDoc.onSnapshot(onProfile, function () { setStatus('error'); });
    weightsCol.onSnapshot(onWeights, function () { setStatus('error'); });
    foodsCol.onSnapshot(onFoods, function () { setStatus('error'); });
    diaryCol.onSnapshot(onDiary, function () { setStatus('error'); });
    sleepsCol.onSnapshot(onSleeps, function () { setStatus('error'); });
    if (typeof onCombos === 'function') combosCol.onSnapshot(onCombos, function () { setStatus('error'); });
    if (Object.keys(nq).length) nDrain();
    if (touched) flushNow();
  }
  accInit();
  init();
  keepAwake();
  tmRestore();
  setInterval(tmTick, 1000);
})();

}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
